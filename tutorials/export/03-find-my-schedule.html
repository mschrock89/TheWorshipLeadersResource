<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Find My Schedule</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #050607;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    .stage {
      height: 100%;
      height: 100dvh;
      display: grid;
      place-items: center;
    }

    .frame {
      position: relative;
      height: 100%;
      max-height: 100dvh;
      aspect-ratio: 1080 / 2338;
      max-width: 100vw;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
      cursor: pointer;
    }

    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel {
      display: none !important;
      -webkit-appearance: none;
      opacity: 0;
      pointer-events: none;
    }

    .play {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 112px;
      height: 112px;
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.94);
      color: #111418;
      cursor: pointer;
      box-shadow:
        0 16px 50px rgba(0, 0, 0, 0.45),
        0 0 0 10px rgba(255, 255, 255, 0.14);
      transition: transform 160ms ease, background 160ms ease;
    }

    .play:hover {
      transform: translate(-50%, -50%) scale(1.06);
      background: #fff;
    }

    .play:active {
      transform: translate(-50%, -50%) scale(0.96);
    }

    .play[hidden] {
      display: none;
    }

    .play svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="frame">
      <video id="tutorial" playsinline preload="auto" poster="03-find-my-schedule-poster.jpg" src="03-find-my-schedule.mp4"></video>
      <button class="play" type="button" aria-label="Play">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path fill="currentColor" d="M31 17 L88 50 L31 83 Z" />
        </svg>
      </button>
    </div>
  </main>
  <script>
    const video = document.getElementById("tutorial");
    const play = document.querySelector(".play");

    play.addEventListener("click", () => {
      video.play();
    });

    video.addEventListener("click", () => {
      if (video.paused) video.play();
      else video.pause();
    });

    video.addEventListener("play", () => {
      play.hidden = true;
    });

    video.addEventListener("pause", () => {
      play.hidden = false;
    });

    video.addEventListener("ended", () => {
      play.hidden = false;
      video.currentTime = 0;
    });
  </script>
</body>
</html>
